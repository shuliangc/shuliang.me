name: Sync MD to HTML

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "sync.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

concurrency:
  group: sync-md
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 使用默认 GITHUB_TOKEN 提交时，需要 fetch-depth: 0 以便 push
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sync (rebuild)
        run: node sync.js --rebuild

      - name: Commit & push generated html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html .sync-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync md to html [skip ci]"
            git push
          fi
